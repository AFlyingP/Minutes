[project]
name = "minutes"
version = "0.1.0"
description = "Search and question answering over city council records"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary,pool]==3.3.6",
  "pgvector==0.5.0",
  "httpx==0.28.1",
  "pdfplumber==0.11.10",
  "pypdfium2==5.13.0",
  "pillow==12.3.0",
  "numpy==2.5.3",
  "typer==0.27.2",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "mcp==2.3.0",
  "langgraph==1.2.12",
  "langchain-core==1.6.6",
  "qdrant-client==1.19.1",
  "jsonschema==4.26.0",
]

[project.scripts]
minutes = "minutes.cli:app"

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "reportlab==5.0.1",
]
gpu = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "sentence-transformers==6.1.0",
  "python-doctr==1.1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minutes"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "tests", "tasks.py"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "sentence_transformers.*", "doctr.*", "pdfplumber.*", "pypdfium2.*", "reportlab.*", "pgvector.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=20 -p no:cacheprovider"
timeout_method = "thread"
markers = [
  "integration: needs the PostgreSQL container",
  "e2e: runs the demo scenario through the API",
]

[tool.coverage.run]
source = ["minutes"]
omit = [
  "src/minutes/models/embedder.py",
  "src/minutes/models/reranker.py",
  "src/minutes/probe.py",
]

[tool.coverage.report]
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:"]
