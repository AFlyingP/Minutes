name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: minutes
          POSTGRES_PASSWORD: minutes
          POSTGRES_DB: minutes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minutes -d minutes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MINUTES_SKIP_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv python install 3.12.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: uv run python tasks.py setup
      - run: uv run python tasks.py check
